<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog — Education World Travel</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/blog.css?v=3" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="../index.html">
          <img class="brand-logo" src="../assets/images/favicon.png" alt="Education World Travel logo" />
          <span class="brand-text">Education World Travel</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span>
        </button>
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="nav-link" href="../index.html">Home</a>
          <a class="nav-link active" href="blog.html">Blog</a>
          <a class="nav-link" href="store.html">Store</a>
          <a class="nav-link" href="about.html">What is Education World Travel?</a>
          <a class="nav-link" href="downloads.html">Downloads</a>
        </nav>
      </div>
    </header>
    <main class="blog-page" data-blog-content-root="../" data-blog-post-page="blog-post.html">
      <section class="blog-top">
        <div class="blog-top-copy">
          <p class="eyebrow">Blog</p>
          <h1>Education World Travel blog</h1>
          <p>Discover new blog posts on this page by Education World Travel.</p>
        </div>
      </section>
      <section class="blog-discovery" aria-label="Find blog posts">
        <label class="blog-search">
          <span class="sr-only">Search blog posts</span>
          <input id="blogSearch" type="search" placeholder="Search stories, places, and topics…" />
        </label>
        <p id="blogStatus" aria-live="polite"></p>
      </section>
      <section class="blog-filters" id="blogFilters" aria-label="Blog categories">
        <button class="filter-button active" data-filter="all">All posts</button>
      </section>
      <section class="blog-grid" id="blogGrid"></section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="../js/markdown.js?v=2"></script>
    <script src="../js/blog.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
